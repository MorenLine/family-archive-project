version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: family-archive-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: family_archive
      MYSQL_USER: familyuser
      MYSQL_PASSWORD: familypassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - family-archive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-archive-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/family_archive?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurity
      JWT_EXPIRATION: 86400000
    volumes:
      - ./backend/uploads:/app/uploads
      - ./frontend:/app/frontend
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - family-archive-network

networks:
  family-archive-network:
    driver: bridge

volumes:
  mysql_data:

