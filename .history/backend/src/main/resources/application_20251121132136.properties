# Настройка подключения MySQL для OpenServer
spring.datasource.url=jdbc:mysql://localhost:3306/family_archive?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Настройки JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Статические файлы из classpath (теперь правильно!)
spring.mvc.static-path-pattern=/**

# Логирование (можно уменьшить)
logging.level.org.springframework.web=INFO

# Отключаем кеш для разработки
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

# Настройки для загрузки файлов
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Путь для загрузки файлов (относительно корня проекта)
file.upload-dir=uploads/

# Разрешаем доступ к статическим файлам uploads
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
