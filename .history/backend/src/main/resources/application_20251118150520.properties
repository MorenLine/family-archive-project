# Настройка подключения MySQL для OpenServer
spring.datasource.url=jdbc:mysql://localhost:3306/family_archive?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Настройки JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Статические файлы из classpath (теперь правильно!)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Логирование (можно уменьшить)
logging.level.org.springframework.web=INFO

# Указываем путь к внешней папке frontend
spring.web.resources.static-locations=file:./../frontend/
spring.mvc.static-path-pattern=/**

# Отключаем кеш для разработки
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false
