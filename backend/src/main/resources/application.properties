# Настройка подключения MySQL для OpenServer
spring.datasource.url=jdbc:mysql://localhost:3306/family_archive?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Настройки JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

# Указываем путь к внешней папке frontend
# Путь относительно рабочей директории (должна быть папка backend)
spring.web.resources.static-locations=file:../frontend/
spring.mvc.static-path-pattern=/**
spring.web.resources.add-mappings=true

# Логирование
logging.level.org.springframework.web=DEBUG
logging.level.org.family_tree=DEBUG
logging.level.org.springframework.security=DEBUG

# Отключаем кеш для разработки
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

# Настройки для загрузки файлов
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Путь для загрузки файлов (относительно корня проекта)
file.upload-dir=uploads/

# JWT настройки
jwt.secret=mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurity
jwt.expiration=86400000


