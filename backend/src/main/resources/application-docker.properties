# Настройка подключения MySQL для Docker
# Переменные окружения переопределяют эти значения автоматически
spring.datasource.url=jdbc:mysql://mysql:3306/family_archive?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=rootpassword

# Настройки JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Указываем путь к внешней папке frontend
spring.web.resources.static-locations=file:/app/frontend/
spring.mvc.static-path-pattern=/**
spring.web.resources.add-mappings=true

# Логирование
logging.level.org.springframework.web=INFO
logging.level.org.family_tree=INFO
logging.level.org.springframework.security=WARN

# Отключаем кеш для разработки
spring.web.resources.cache.period=0
spring.thymeleaf.cache=false

# Настройки для загрузки файлов
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Путь для загрузки файлов (относительно рабочей директории)
file.upload-dir=/app/uploads/

# JWT настройки
# Эти значения могут быть переопределены через переменные окружения
jwt.secret=mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForSecurity
jwt.expiration=86400000

